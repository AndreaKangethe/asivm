services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: asivm
      POSTGRES_USER: asivm
      POSTGRES_PASSWORD: asivm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asivm -d asivm"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://asivm:asivm@postgres:5432/asivm
      API_KEY: ${API_KEY:-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
